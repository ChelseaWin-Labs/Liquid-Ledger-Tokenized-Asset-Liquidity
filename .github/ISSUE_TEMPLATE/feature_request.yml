name: Feature Request
description: Suggest an idea or enhancement for Liquid Ledger
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make Liquid Ledger better!
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which area does this feature relate to?
      options:
        - Smart Contracts (Soroban/Rust)
        - Backend API (Node.js/Prisma)
        - Frontend Application (React/Tailwind)
        - Tokenization & Settlement Protocol
        - Debit Card / POS Simulator
        - Developer Experience & Tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

