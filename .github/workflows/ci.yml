name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Soroban Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "smart-contracts -> smart-contracts/target"

      - name: Check Formatting
        run: cd smart-contracts && cargo fmt --all -- --check

      - name: Run Clippy
        run: cd smart-contracts && cargo clippy --all-targets -- -D warnings

      - name: Run Cargo Tests
        run: cd smart-contracts && cargo test

      - name: Build Soroban WASM
        run: cd smart-contracts && cargo build --target wasm32-unknown-unknown --release

  backend:
    name: Backend API & Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: TypeScript Compilation & Typecheck
        run: cd backend && npm run build

      - name: Run Backend Tests
        run: cd backend && npm test

  frontend:
    name: Frontend Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend && npm install

      - name: Build Frontend Application
        run: cd frontend && npm run build

      - name: Run Frontend Tests
        run: cd frontend && npm test
